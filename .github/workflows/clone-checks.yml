name: Clone extension

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clone-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clone-extension:
    name: Clone typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clone_sdk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLONE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clone_sdk_test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/clone-ui/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"
      - name: Install core, Clone, and pinned official GBrain
        run: |
          npm ci
          npm run clone:setup
      - name: Typecheck core and Clone
        run: |
          npm run typecheck
          npm run clone:typecheck
      - name: Clone lifecycle and real GBrain tests
        run: npm run clone:test
      - name: Trusted local runtime regression tests
        run: node --test test/host-sandbox.test.ts test/config.test.ts
      - name: Build Clone web application
        run: npm run clone:build
